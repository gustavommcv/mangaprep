# JPEG pages are decoded by libjpeg-turbo through mozjpeg (ADR 0028). Both crates package
# libjpeg-turbo's combined notice: the IJG's, whose full terms the jpeg-encoder entry below
# already reproduces, and libjpeg-turbo's own BSD-3-Clause. mozjpeg-sys is built without SIMD,
# so the zlib-licensed SIMD sources it also carries are not compiled.
[mozjpeg]
accepted = ["IJG", "BSD-3-Clause"]
[mozjpeg.clarify]
license = "IJG AND BSD-3-Clause"
[[mozjpeg.clarify.files]]
path = "LICENSE"
license = "IJG"
checksum = "328b7acae3fa659297a1075679723d8247f8b7f1320864a674351722b2f62a7f"
start = "The Independent JPEG Group's JPEG software"
end = "(also known as JPEG, together with ITU-T SG16)."
[[mozjpeg.clarify.files]]
path = "LICENSE"
license = "BSD-3-Clause"
checksum = "6326afed3960ca4bc9dec51c1ae2dc53aaa4ef3e9c0799df61d3259ef0af7b91"
start = "Copyright (C)2009-2023 D. R. Commander."
end = "POSSIBILITY OF SUCH DAMAGE."

