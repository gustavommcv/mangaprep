# Used to generate distribution notices, not to change the project's own license.
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "Zlib", "Unicode-3.0"]
ignore-dev-dependencies = true
workarounds = ["rustix"]

# bzip2 uses a pure-Rust port of the C library; its metadata names that library's license.
[libbz2-rs-sys]
accepted = ["bzip2-1.0.6"]

# A build dependency of mozjpeg-sys, offered under CC0-1.0, MIT-0 or Apache-2.0: CC0-1.0 is the
# text it packages, so that one is taken.
[dunce]
accepted = ["CC0-1.0"]
[dunce.clarify]
license = "CC0-1.0"
[[dunce.clarify.files]]
path = "LICENSE"
checksum = "a2010f343487d3f7618affe54f789f5487602331c0a8d03f49e9a7c547cf0499"

# Dual-licensed CC0-1.0 or MIT-0: the permissive MIT-0 is the one taken.
[ppmd-rust]
accepted = ["MIT-0"]

# Use the BSD text actually packaged, rather than the manifest's legacy slash expression.
[brotli-decompressor.clarify]
license = "BSD-3-Clause"
[[brotli-decompressor.clarify.files]]
path = "LICENSE"
checksum = "c0c56f26d9c051cac4d200c34c84e7ae9aaa853e01a982a1df08b09931e518ae"

