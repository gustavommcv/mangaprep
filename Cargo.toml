[workspace]
resolver = "2"
members = ["crates/mangaprep-core", "crates/mangaprep-cli"]

[workspace.package]
version = "0.8.3"
edition = "2021"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gustavommcv/mangaprep"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
png = "0.18"
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
# libjpeg-turbo's decoder, as Pillow decodes JPEG for KCC (ADR 0028). Built from its C sources
# without SIMD, so no assembler is needed and every target decodes the same; `unwinding` is what
# lets libjpeg's errors come back to Rust.
mozjpeg = { version = "0.10", default-features = false }
mozjpeg-sys = { version = "2", default-features = false, features = ["unwinding", "parallel"] }
rustfft = "6"
zip = "9"
rayon = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
lopdf = { version = "0.44", default-features = false }
roxmltree = "0.21"
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
